<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="400" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#333">二つの物語が、章ごとに交互に進む</text>
  <!-- left -->
  <rect x="40" y="80" width="320" height="250" rx="16" fill="#e8f1fb" stroke="#3b78c2" stroke-width="2"/>
  <text x="200" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#1f4f8a">ハードボイルド・</text>
  <text x="200" y="146" text-anchor="middle" font-size="22" font-weight="700" fill="#1f4f8a">ワンダーランド</text>
  <text x="200" y="178" text-anchor="middle" font-size="18" fill="#333">奇数の章（1・3・5…）</text>
  <text x="200" y="214" text-anchor="middle" font-size="18" fill="#333">語り手：「私」（計算士）</text>
  <text x="200" y="246" text-anchor="middle" font-size="18" fill="#333">舞台：東京の地上と地下</text>
  <text x="200" y="278" text-anchor="middle" font-size="18" fill="#333">テンポ：速い冒険もの</text>
  <text x="200" y="310" text-anchor="middle" font-size="16" fill="#555">博士・孫娘・やみくろ</text>
  <!-- right -->
  <rect x="440" y="80" width="320" height="250" rx="16" fill="#f3eee6" stroke="#9a7b4f" stroke-width="2"/>
  <text x="600" y="132" text-anchor="middle" font-size="22" font-weight="700" fill="#6b5130">世界の終り</text>
  <text x="600" y="178" text-anchor="middle" font-size="18" fill="#333">偶数の章（2・4・6…）</text>
  <text x="600" y="214" text-anchor="middle" font-size="18" fill="#333">語り手：「僕」（夢読み）</text>
  <text x="600" y="246" text-anchor="middle" font-size="18" fill="#333">舞台：高い壁に囲まれた街</text>
  <text x="600" y="278" text-anchor="middle" font-size="18" fill="#333">テンポ：静かな幻想もの</text>
  <text x="600" y="310" text-anchor="middle" font-size="16" fill="#555">影・門番・一角獣</text>
  <!-- arrows -->
  <path d="M360 170 C 390 150, 410 150, 440 170" fill="none" stroke="#888" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M440 250 C 410 270, 390 270, 360 250" fill="none" stroke="#888" stroke-width="2.5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
  <!-- bottom -->
  <rect x="130" y="360" width="540" height="64" rx="32" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="400" y="400" text-anchor="middle" font-size="19" fill="#333">二つの世界のつながりは？ → 読みながら見えてくる</text>
</svg>
