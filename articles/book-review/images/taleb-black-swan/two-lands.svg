<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Noto Sans JP, sans-serif"><rect width="800" height="440" fill="#ffffff"/><text x="400" y="40" font-size="22" fill="#24303d" text-anchor="middle" font-weight="700">「月並みの国」と「果ての国」</text><rect x="60" y="70" width="320" height="330" rx="14" fill="#eef4f6"/><text x="220" y="108" font-size="21" fill="#2d6a7a" text-anchor="middle" font-weight="700">月並みの国</text><rect x="100" y="195" width="24" height="105" rx="4" fill="#2d6a7a"/><rect x="136" y="181" width="24" height="119" rx="4" fill="#2d6a7a"/><rect x="172" y="188" width="24" height="112" rx="4" fill="#2d6a7a"/><rect x="208" y="174" width="24" height="126" rx="4" fill="#2d6a7a"/><rect x="244" y="184" width="24" height="116" rx="4" fill="#2d6a7a"/><rect x="280" y="179" width="24" height="121" rx="4" fill="#2d6a7a"/><rect x="316" y="190" width="24" height="110" rx="4" fill="#2d6a7a"/><text x="220" y="334" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">例：身長・体重</text><text x="220" y="358" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">一人がどれだけ極端でも</text><text x="220" y="382" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">全体の平均はほとんど動かない</text><rect x="420" y="70" width="320" height="330" rx="14" fill="#fbefe9"/><text x="580" y="108" font-size="21" fill="#c0603a" text-anchor="middle" font-weight="700">果ての国</text><rect x="460" y="292" width="24" height="8" rx="4" fill="#c0603a"/><rect x="496" y="288" width="24" height="12" rx="4" fill="#c0603a"/><rect x="532" y="293" width="24" height="7" rx="4" fill="#c0603a"/><rect x="568" y="290" width="24" height="10" rx="4" fill="#c0603a"/><rect x="604" y="292" width="24" height="8" rx="4" fill="#c0603a"/><rect x="640" y="138" width="24" height="162" rx="4" fill="#c0603a"/><rect x="676" y="290" width="24" height="10" rx="4" fill="#c0603a"/><text x="580" y="334" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">例：資産・本の売上</text><text x="580" y="358" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">たった一人が</text><text x="580" y="382" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">全体をひっくり返す</text></svg>