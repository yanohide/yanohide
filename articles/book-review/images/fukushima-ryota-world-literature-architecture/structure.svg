<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Noto Sans JP, sans-serif"><rect width="800" height="500" fill="#ffffff"/><text x="400" y="40" font-size="22" fill="#24303d" text-anchor="middle" font-weight="700">本の構成を「建物」にたとえると（三部構成）</text><path d="M150,190 L400,80 L650,190 Z" fill="#fbefe9" stroke="#c0603a" stroke-width="3"/><text x="400" y="140" font-size="18" fill="#c0603a" text-anchor="middle" font-weight="700">第三部　思考のテーマ</text><text x="400" y="170" font-size="15" fill="#24303d" text-anchor="middle" font-weight="400">環境・絶滅・主体・制作・可塑性・不確実性・時間</text><rect x="170" y="200" width="460" height="150" fill="#eef4f6" stroke="#2d6a7a" stroke-width="3"/><text x="400" y="240" font-size="18" fill="#2d6a7a" text-anchor="middle" font-weight="700">第二部　進化史</text><text x="400" y="272" font-size="15" fill="#24303d" text-anchor="middle" font-weight="400">国や時代をこえて、小説がどう進化してきたか</text><text x="400" y="300" font-size="15" fill="#6b7685" text-anchor="middle" font-weight="400">（中国の小説、日本の文学、海をめぐる物語 など）</text><rect x="230" y="318" width="40" height="32" fill="#fff" stroke="#2d6a7a" stroke-width="2"/><rect x="300" y="318" width="40" height="32" fill="#fff" stroke="#2d6a7a" stroke-width="2"/><rect x="500" y="318" width="40" height="32" fill="#fff" stroke="#2d6a7a" stroke-width="2"/><rect x="570" y="318" width="40" height="32" fill="#fff" stroke="#2d6a7a" stroke-width="2"/><rect x="120" y="360" width="560" height="70" fill="#eceff3" stroke="#6b7685" stroke-width="3"/><text x="400" y="392" font-size="18" fill="#24303d" text-anchor="middle" font-weight="700">第一部　地盤</text><text x="400" y="418" font-size="15" fill="#24303d" text-anchor="middle" font-weight="400">ゲーテの「世界文学」と、小説の古い層</text><text x="400" y="470" font-size="15" fill="#6b7685" text-anchor="middle" font-weight="400">土台の上に歴史の階が積まれ、その上で今の問いを考える。読む順番の目安にもなる</text></svg>