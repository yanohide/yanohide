<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Noto Sans JP, sans-serif"><rect width="800" height="440" fill="#ffffff"/><text x="400" y="40" font-size="22" fill="#24303d" text-anchor="middle" font-weight="700">小説は、心や社会を「言葉」に変える装置（※イメージ図）</text><rect x="40" y="110" width="200" height="130" rx="16" fill="#eef4f6"/><text x="140" y="165" font-size="19" fill="#2d6a7a" text-anchor="middle" font-weight="700">心の動き</text><text x="140" y="198" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">社会の出来事</text><rect x="300" y="110" width="200" height="130" rx="16" fill="#fbefe9"/><text x="400" y="165" font-size="19" fill="#c0603a" text-anchor="middle" font-weight="700">小説</text><text x="400" y="198" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">言葉に変換する</text><rect x="560" y="110" width="200" height="130" rx="16" fill="#eef4f6"/><text x="660" y="165" font-size="19" fill="#2d6a7a" text-anchor="middle" font-weight="700">商品として流通</text><text x="660" y="198" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">世界中の読者へ</text><path d="M248,175 L292,175" stroke="#24303d" stroke-width="3"/><path d="M284,167 L294,175 L284,183" fill="none" stroke="#24303d" stroke-width="3"/><path d="M508,175 L552,175" stroke="#24303d" stroke-width="3"/><path d="M544,167 L554,175 L544,183" fill="none" stroke="#24303d" stroke-width="3"/><path d="M660,250 C660,296 140,296 140,250" fill="none" stroke="#6b7685" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M132,262 L140,248 L148,262" fill="none" stroke="#6b7685" stroke-width="2.5"/><text x="400" y="330" font-size="16" fill="#6b7685" text-anchor="middle" font-weight="400">読まれた小説が、また人の心や社会を変えていく</text><text x="400" y="380" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">本書は、この仕組みが資本主義とともにどう育ってきたかを、</text><text x="400" y="406" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">18世紀以降の「世界文学」の歴史としてたどっていく</text></svg>