<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Noto Sans JP, sans-serif"><rect width="800" height="450" fill="#ffffff"/><text x="400" y="40" font-size="22" fill="#24303d" text-anchor="middle" font-weight="700">「サイエンス・ウォーズ」で向き合った二つの見方</text><rect x="50" y="80" width="300" height="200" rx="16" fill="#eef4f6"/><text x="200" y="122" font-size="20" fill="#2d6a7a" text-anchor="middle" font-weight="700">科学者の側</text><text x="200" y="172" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">科学は、自然のしくみを</text><text x="200" y="202" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">できるだけ正確に写しとる</text><text x="200" y="232" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">（実在論）</text><rect x="450" y="80" width="300" height="200" rx="16" fill="#fbefe9"/><text x="600" y="122" font-size="20" fill="#c0603a" text-anchor="middle" font-weight="700">科学論・社会学の側</text><text x="600" y="172" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">科学の知識も、研究者の社会や</text><text x="600" y="202" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">時代の影響を受けてつくられる</text><text x="600" y="232" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">（社会構成主義）</text><path d="M355,180 L445,180" stroke="#6b7685" stroke-width="3"/><path d="M365,172 L353,180 L365,188 M435,172 L447,180 L435,188" fill="none" stroke="#6b7685" stroke-width="3"/><text x="400" y="168" font-size="16" fill="#6b7685" text-anchor="middle" font-weight="400">対立</text><rect x="180" y="320" width="440" height="80" rx="16" fill="#f5f6f8"/><text x="400" y="354" font-size="17" fill="#24303d" text-anchor="middle" font-weight="400">本書は、この論争の流れを日本語で整理し、</text><text x="400" y="382" font-size="17" fill="#24303d" text-anchor="middle" font-weight="400">科学と社会の関係をあらためて問い直す</text></svg>