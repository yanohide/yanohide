<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Noto Sans JP, sans-serif"><rect width="800" height="450" fill="#ffffff"/><text x="400" y="40" font-size="22" fill="#24303d" text-anchor="middle" font-weight="700">結果を知ると、たどった道だけが「当然」に見える</text><circle cx="90" cy="250" r="10" fill="#24303d"/><text x="90" y="285" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">いま</text><path d="M90,250 Q330,170.0 540,90" fill="none" stroke="#e3e8ee" stroke-width="3"/><circle cx="540" cy="90" r="9" fill="#6b7685"/><text x="560" y="96" font-size="16" fill="#6b7685" text-anchor="start" font-weight="400">ありえた別の未来</text><path d="M90,250 Q330,199.0 540,148" fill="none" stroke="#e3e8ee" stroke-width="3"/><circle cx="540" cy="148" r="9" fill="#6b7685"/><text x="560" y="154" font-size="16" fill="#6b7685" text-anchor="start" font-weight="400">ありえた別の未来</text><path d="M90,250 Q330,228.0 540,206" fill="none" stroke="#c0603a" stroke-width="5"/><circle cx="540" cy="206" r="9" fill="#c0603a"/><text x="560" y="212" font-size="16" fill="#c0603a" text-anchor="start" font-weight="400">実際に起きたこと</text><path d="M90,250 Q330,257.0 540,264" fill="none" stroke="#e3e8ee" stroke-width="3"/><circle cx="540" cy="264" r="9" fill="#6b7685"/><text x="560" y="270" font-size="16" fill="#6b7685" text-anchor="start" font-weight="400">ありえた別の未来</text><path d="M90,250 Q330,286.0 540,322" fill="none" stroke="#e3e8ee" stroke-width="3"/><circle cx="540" cy="322" r="9" fill="#6b7685"/><text x="560" y="328" font-size="16" fill="#6b7685" text-anchor="start" font-weight="400">ありえた別の未来</text><path d="M90,250 Q330,315.0 540,380" fill="none" stroke="#e3e8ee" stroke-width="3"/><circle cx="540" cy="380" r="9" fill="#6b7685"/><text x="560" y="386" font-size="16" fill="#6b7685" text-anchor="start" font-weight="400">ありえた別の未来</text><text x="400" y="436" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">事前には、たくさんの未来がありえた。あとから振り返ると、1本の線しか見えなくなる</text></svg>