<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Noto Sans JP, sans-serif"><rect width="800" height="400" fill="#ffffff"/><text x="400" y="40" font-size="22" fill="#24303d" text-anchor="middle" font-weight="700">ソーカル事件から本書まで</text><rect x="40" y="90" width="130" height="190" rx="14" fill="#eef4f6"/><text x="105" y="130" font-size="19" fill="#2d6a7a" text-anchor="middle" font-weight="700">1996年</text><text x="105" y="190" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">でたらめ論文を</text><text x="105" y="216" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">思想誌に投稿</text><path d="M174,185 L186,185" stroke="#24303d" stroke-width="3"/><path d="M180,178 L188,185 L180,192" fill="none" stroke="#24303d" stroke-width="2.5"/><rect x="190" y="90" width="130" height="190" rx="14" fill="#eef4f6"/><text x="255" y="130" font-size="19" fill="#2d6a7a" text-anchor="middle" font-weight="700">掲載</text><text x="255" y="190" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">そのまま</text><text x="255" y="216" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">雑誌に載る</text><path d="M324,185 L336,185" stroke="#24303d" stroke-width="3"/><path d="M330,178 L338,185 L330,192" fill="none" stroke="#24303d" stroke-width="2.5"/><rect x="340" y="90" width="130" height="190" rx="14" fill="#fbefe9"/><text x="405" y="130" font-size="19" fill="#c0603a" text-anchor="middle" font-weight="700">種明かし</text><text x="405" y="190" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">別の雑誌で</text><text x="405" y="216" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">パロディと公表</text><path d="M474,185 L486,185" stroke="#24303d" stroke-width="3"/><path d="M480,178 L488,185 L480,192" fill="none" stroke="#24303d" stroke-width="2.5"/><rect x="490" y="90" width="130" height="190" rx="14" fill="#eef4f6"/><text x="555" y="130" font-size="19" fill="#2d6a7a" text-anchor="middle" font-weight="700">大論争</text><text x="555" y="190" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">科学と人文学が</text><text x="555" y="216" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">激しく対立</text><path d="M624,185 L636,185" stroke="#24303d" stroke-width="3"/><path d="M630,178 L638,185 L630,192" fill="none" stroke="#24303d" stroke-width="2.5"/><rect x="640" y="90" width="130" height="190" rx="14" fill="#fbefe9"/><text x="705" y="130" font-size="19" fill="#c0603a" text-anchor="middle" font-weight="700">1997年</text><text x="705" y="190" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">本書を出版</text><text x="705" y="216" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">（仏語版）</text><text x="400" y="330" font-size="17" fill="#24303d" text-anchor="middle" font-weight="400">「難しい言葉が並んでいれば、中身を確かめずに通ってしまうのでは？」</text><text x="400" y="360" font-size="16" fill="#6b7685" text-anchor="middle" font-weight="400">その問いを、科学の言葉の使われ方から一つずつ検証したのが『「知」の欺瞞』</text></svg>