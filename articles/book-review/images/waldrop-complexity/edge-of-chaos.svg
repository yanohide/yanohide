<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Noto Sans JP, sans-serif"><rect width="800" height="460" fill="#ffffff"/><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2d6a7a"/><stop offset="0.5" stop-color="#e9c46a"/><stop offset="1" stop-color="#c0603a"/></linearGradient></defs><text x="400" y="40" font-size="22" fill="#24303d" text-anchor="middle" font-weight="700">「カオスの縁」と、下から生まれる秩序</text><rect x="60" y="80" width="680" height="34" rx="17" fill="url(#g)"/><text x="110" y="150" font-size="19" fill="#24303d" text-anchor="middle" font-weight="700">秩序</text><text x="110" y="176" font-size="16" fill="#6b7685" text-anchor="middle" font-weight="400">固まって動かない</text><text x="400" y="150" font-size="19" fill="#24303d" text-anchor="middle" font-weight="700">カオスの縁</text><text x="400" y="176" font-size="16" fill="#6b7685" text-anchor="middle" font-weight="400">変化と安定のあいだ</text><text x="690" y="150" font-size="19" fill="#24303d" text-anchor="middle" font-weight="700">カオス</text><text x="690" y="176" font-size="16" fill="#6b7685" text-anchor="middle" font-weight="400">ばらばらで続かない</text><path d="M400,190 L400,214" stroke="#24303d" stroke-width="2"/><text x="400" y="238" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">生命や経済、社会は、このあたりで「学び、変わり続ける」と考えられた</text><circle cx="168" cy="360" r="7" fill="#2d6a7a"/><circle cx="194" cy="366" r="7" fill="#2d6a7a"/><circle cx="245" cy="307" r="7" fill="#2d6a7a"/><circle cx="123" cy="392" r="7" fill="#2d6a7a"/><circle cx="172" cy="326" r="7" fill="#2d6a7a"/><circle cx="319" cy="352" r="7" fill="#2d6a7a"/><circle cx="287" cy="352" r="7" fill="#2d6a7a"/><circle cx="248" cy="317" r="7" fill="#2d6a7a"/><circle cx="247" cy="395" r="7" fill="#2d6a7a"/><circle cx="225" cy="382" r="7" fill="#2d6a7a"/><circle cx="254" cy="307" r="7" fill="#2d6a7a"/><circle cx="272" cy="365" r="7" fill="#2d6a7a"/><circle cx="180" cy="303" r="7" fill="#2d6a7a"/><circle cx="293" cy="352" r="7" fill="#2d6a7a"/><text x="220" y="446" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">一人ひとりは単純なルールで動く</text><path d="M360,355 L440,355" stroke="#24303d" stroke-width="3"/><path d="M432,347 L444,355 L432,363" fill="none" stroke="#24303d" stroke-width="3"/><text x="400" y="342" font-size="17" fill="#c0603a" text-anchor="middle" font-weight="700">創発</text><circle cx="500" cy="355" r="6" fill="#c0603a"/><circle cx="509" cy="366" r="6" fill="#c0603a"/><circle cx="518" cy="376" r="6" fill="#c0603a"/><circle cx="527" cy="380" r="6" fill="#c0603a"/><circle cx="536" cy="380" r="6" fill="#c0603a"/><circle cx="545" cy="375" r="6" fill="#c0603a"/><circle cx="554" cy="365" r="6" fill="#c0603a"/><circle cx="563" cy="354" r="6" fill="#c0603a"/><circle cx="572" cy="343" r="6" fill="#c0603a"/><circle cx="581" cy="334" r="6" fill="#c0603a"/><circle cx="590" cy="329" r="6" fill="#c0603a"/><circle cx="599" cy="330" r="6" fill="#c0603a"/><circle cx="608" cy="336" r="6" fill="#c0603a"/><circle cx="617" cy="345" r="6" fill="#c0603a"/><circle cx="626" cy="357" r="6" fill="#c0603a"/><circle cx="635" cy="368" r="6" fill="#c0603a"/><circle cx="644" cy="377" r="6" fill="#c0603a"/><circle cx="653" cy="381" r="6" fill="#c0603a"/><circle cx="662" cy="380" r="6" fill="#c0603a"/><circle cx="671" cy="373" r="6" fill="#c0603a"/><circle cx="680" cy="364" r="6" fill="#c0603a"/><circle cx="689" cy="352" r="6" fill="#c0603a"/><circle cx="698" cy="341" r="6" fill="#c0603a"/><circle cx="707" cy="333" r="6" fill="#c0603a"/><circle cx="716" cy="329" r="6" fill="#c0603a"/><circle cx="725" cy="331" r="6" fill="#c0603a"/><text x="615" y="446" font-size="16" fill="#24303d" text-anchor="middle" font-weight="400">全体として、思いがけない形や流れが生まれる</text></svg>